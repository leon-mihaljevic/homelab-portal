<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808; --bg2:#0e0e0e; --card:#121212;
    --text:#f4f4f5; --muted:#a1a1aa; --border:#27272a;
    --accent:#8b5cf6; --accent-light:#a78bfa; --accent-dark:#6d28d9;
    --danger:#ef4444; --danger-light:#f87171;
    --max-width:1400px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; font-size:16px;
  }
  .container{ width:min(100% - 48px, var(--max-width)); margin:0 auto; }

  header.site-header{
    border-bottom:1px solid var(--border);
    padding:22px 0;
    background:rgba(8,8,8,0.85);
    backdrop-filter: blur(10px);
    position:sticky; top:0; z-index:10;
  }
  header .container{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-size:20px; font-weight:800; letter-spacing:-0.02em; color:var(--text); text-decoration:none; }
  .brand span{ color:var(--accent-light); }
  .term-line{
    font-family: "JetBrains Mono", monospace;
    color: var(--accent-light); font-size:13px; letter-spacing:0.05em;
    margin-bottom:10px;
  }

  main{ padding: 48px 0 100px; }

  h1{ font-size: clamp(2rem, 4vw, 3rem); letter-spacing:-0.03em; margin-bottom:10px; }
  h2{ font-size: 1.5rem; letter-spacing:-0.02em; margin-bottom:4px; }
  .subtitle{ color:var(--muted); font-size:16px; margin-bottom:36px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:14px 26px; border-radius:9px; font-size:15px; font-weight:600;
    border:none; cursor:pointer; text-decoration:none;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .btn-primary{
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:white;
    box-shadow: 0 8px 25px rgba(139,92,246,0.18);
  }
  .btn-primary:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 34px rgba(139,92,246,0.35);
  }
  .btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-ghost:hover{
    border-color:var(--accent); color:var(--accent-light);
    background:rgba(139,92,246,0.07); transform: translateY(-2px);
  }
  .btn-danger{ background:transparent; border:1px solid rgba(239,68,68,0.35); color:var(--danger-light); }
  .btn-danger:hover{
    background:rgba(239,68,68,0.1); border-color:var(--danger); transform:translateY(-2px);
  }
  .btn-sm{ padding:8px 14px; font-size:13px; border-radius:7px; }

  .toolbar{ display:flex; gap:12px; margin-bottom:40px; flex-wrap:wrap; }

  .flash{
    padding:14px 18px; border-radius:8px; margin-bottom:24px;
    background: rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.3);
    color: var(--accent-light); font-size:14px;
  }

  .server-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap:24px;
  }
  .server-card{
    background: radial-gradient(circle at top right, rgba(139,92,246,0.08), transparent 45%), var(--card);
    border:1px solid var(--border); border-radius:14px; padding:28px;
    transition: border-color 0.25s ease;
  }
  .server-card:hover{ border-color: rgba(139,92,246,0.35); }

  .server-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px; }
  .server-meta{ color:var(--muted); font-size:14px; margin-bottom:18px; }
  .badge{
    display:inline-block; padding:4px 10px; border-radius:999px; font-size:11px;
    font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    background: rgba(139,92,246,0.12); color:var(--accent-light);
    border:1px solid rgba(139,92,246,0.25); white-space:nowrap;
  }

  .status-badge{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
    border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.05em;
    text-transform:uppercase; white-space:nowrap;
  }
  .status-badge .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .status-live{
    background: rgba(34,197,94,0.12); color:#4ade80; border:1px solid rgba(34,197,94,0.3);
  }
  .status-live .dot{
    background:#22c55e;
    animation: pulse-dot 2s infinite;
  }
  .status-offline{
    background: rgba(239,68,68,0.1); color:var(--danger-light); border:1px solid rgba(239,68,68,0.25);
  }
  .status-offline .dot{ background: var(--danger); }

  @keyframes pulse-dot{
    0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.55); }
    70%  { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }

  table{ width:100%; border-collapse:collapse; margin:18px 0; }
  th, td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); font-size:14px; }
  th{ color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
  td.empty{ color:var(--muted); font-style:italic; }

  .row-actions{ display:flex; gap:8px; }
  .row-actions form{ display:inline; }

  .card-actions{ display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }

  form.stack{ max-width:520px; }
  label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; margin-top:16px; }
  label:first-of-type{ margin-top:0; }
  input, select, textarea{
    width:100%; padding:12px 14px; background:var(--bg2); color:var(--text);
    border:1px solid var(--border); border-radius:8px; font-size:15px;
    font-family:inherit; transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--accent);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
  }
  textarea{ resize:vertical; }

  .form-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:36px; margin-top:10px;
  }

  .empty-state{
    text-align:center; padding:80px 20px; color:var(--muted);
    border:1px dashed var(--border); border-radius:14px;
  }

  .disk-bar-wrap{
    width:100%; height:8px; border-radius:999px; background:var(--bg2);
    border:1px solid var(--border); overflow:hidden; margin:6px 0 4px;
  }
  .disk-bar-fill{
    height:100%; border-radius:999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    transition: width 0.4s ease;
  }

  @media (max-width: 640px){
    .server-grid{ grid-template-columns: 1fr; }
    .toolbar{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="{{ url_for('index') }}" class="brand">Homelab<span>Portal</span></a>
  </div>
</header>
<main>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</main>
</body>
</html>
