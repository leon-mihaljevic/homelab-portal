<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="620" fill="#080808"/>

  <!-- GitHub -->
  <rect x="30" y="40" width="160" height="70" rx="10" fill="#121212" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="110" y="70" fill="#f4f4f5" font-size="14" font-weight="700" text-anchor="middle">GitHub</text>
  <text x="110" y="90" fill="#a1a1aa" font-size="11" text-anchor="middle">homelab-portal (public)</text>

  <!-- Jenkins -->
  <rect x="30" y="180" width="220" height="180" rx="10" fill="#121212" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="140" y="205" fill="#f4f4f5" font-size="14" font-weight="700" text-anchor="middle">Jenkins (jenkins-01)</text>
  <text x="140" y="222" fill="#a1a1aa" font-size="10" text-anchor="middle">Poll SCM - no public ingress</text>
  <rect x="50" y="235" width="180" height="26" rx="5" fill="#0e0e0e" stroke="#27272a"/>
  <text x="140" y="252" fill="#c4b5fd" font-size="11" text-anchor="middle">1. Build image</text>
  <rect x="50" y="266" width="180" height="26" rx="5" fill="#0e0e0e" stroke="#27272a"/>
  <text x="140" y="283" fill="#c4b5fd" font-size="11" text-anchor="middle">2. Test (throwaway DB)</text>
  <rect x="50" y="297" width="180" height="26" rx="5" fill="#0e0e0e" stroke="#27272a"/>
  <text x="140" y="314" fill="#c4b5fd" font-size="11" text-anchor="middle">3. Push to Docker Hub</text>
  <rect x="50" y="328" width="180" height="26" rx="5" fill="#0e0e0e" stroke="#27272a"/>
  <text x="140" y="345" fill="#c4b5fd" font-size="11" text-anchor="middle">4. Deploy via SSH</text>

  <!-- Docker Hub -->
  <rect x="320" y="180" width="160" height="70" rx="10" fill="#121212" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="210" fill="#f4f4f5" font-size="13" font-weight="700" text-anchor="middle">Docker Hub</text>
  <text x="400" y="228" fill="#a1a1aa" font-size="10" text-anchor="middle">dexthida/homelab-portal</text>

  <!-- docker-01 -->
  <rect x="560" y="150" width="300" height="260" rx="10" fill="#121212" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="710" y="178" fill="#f4f4f5" font-size="14" font-weight="700" text-anchor="middle">docker-01</text>
  <text x="710" y="195" fill="#a1a1aa" font-size="10" text-anchor="middle">forced-command SSH keys only</text>

  <rect x="580" y="215" width="260" height="60" rx="8" fill="#0e0e0e" stroke="#27272a"/>
  <text x="710" y="235" fill="#f4f4f5" font-size="12" font-weight="600" text-anchor="middle">web (Flask + gunicorn)</text>
  <text x="710" y="252" fill="#a1a1aa" font-size="10" text-anchor="middle">non-root user, login-gated</text>
  <text x="710" y="266" fill="#a1a1aa" font-size="10" text-anchor="middle">port 5000</text>

  <rect x="580" y="290" width="260" height="55" rx="8" fill="#0e0e0e" stroke="#27272a"/>
  <text x="710" y="313" fill="#f4f4f5" font-size="12" font-weight="600" text-anchor="middle">db (Postgres 16)</text>
  <text x="710" y="330" fill="#a1a1aa" font-size="10" text-anchor="middle">named volume, no host port exposed</text>

  <rect x="580" y="360" width="260" height="34" rx="8" fill="#1a1025" stroke="#6d28d9"/>
  <text x="710" y="381" fill="#c4b5fd" font-size="10" text-anchor="middle">docker-compose.deploy.yml overrides image: not build:</text>

  <!-- Proxmox -->
  <rect x="320" y="460" width="180" height="80" rx="10" fill="#121212" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="410" y="485" fill="#f4f4f5" font-size="13" font-weight="700" text-anchor="middle">Proxmox API</text>
  <text x="410" y="502" fill="#a1a1aa" font-size="10" text-anchor="middle">PVEAuditor token</text>
  <text x="410" y="517" fill="#a1a1aa" font-size="10" text-anchor="middle">(read-only)</text>

  <!-- SSH Agent -->
  <rect x="560" y="460" width="180" height="80" rx="10" fill="#121212" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="650" y="485" fill="#f4f4f5" font-size="13" font-weight="700" text-anchor="middle">SSH agent key</text>
  <text x="650" y="502" fill="#a1a1aa" font-size="10" text-anchor="middle">docker ps / df only</text>
  <text x="650" y="517" fill="#a1a1aa" font-size="10" text-anchor="middle">forced command</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <path d="M110,110 L110,180" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="120" y="150" fill="#a1a1aa" font-size="10">push triggers poll</text>

  <path d="M250,270 L320,235" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M480,235 L560,270" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M250,341 L560,341" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3" fill="none"/>
  <text x="330" y="333" fill="#a1a1aa" font-size="10">SSH deploy</text>

  <path d="M710,275 L710,290" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <path d="M410,460 L580,275" stroke="#c4b5fd" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" fill="none"/>
  <path d="M650,460 L680,275" stroke="#c4b5fd" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" fill="none"/>
  <text x="500" y="440" fill="#7c6ba0" font-size="10">live status pulled on every page load</text>

  <text x="450" y="590" fill="#52525b" font-size="10" text-anchor="middle">Everything runs on-prem on a single Proxmox host (i5-8500, 16GB RAM)</text>
</svg>
